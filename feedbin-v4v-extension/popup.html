<!DOCTYPE html>
<html>
<head>
  <title>Feedbin V4V</title>
  <style>
    body {
      width: 240px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1a1a1a;
      background: #fff;
    }
    .header {
      padding: 12px;
      background: #f7931a;
      color: white;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }
    .header svg {
      width: 18px;
      height: 18px;
      fill: white;
    }
    .content {
      padding: 12px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 500;
    }
    .status-icon {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .status-active .status-icon { background: #4caf50; }
    .status-inactive .status-icon { background: #9e9e9e; }

    .info-card {
      background: #f9f9f9;
      border: 1px solid #eee;
      border-radius: 4px;
      padding: 8px;
      font-size: 12px;
      line-height: 1.3;
      color: #666;
    }
    .footer {
      padding: 8px 12px;
      border-top: 1px solid #eee;
      font-size: 11px;
      color: #999;
      display: flex;
      justify-content: space-between;
    }
    a { color: #f7931a; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <svg viewBox="0 0 17 17">
      <path d="M9.5 1L3 10h4v6l6.5-9H9V1z"/>
    </svg>
    <h1>Feedbin V4V</h1>
  </div>
  <div class="content">
    <div id="v4v-status" class="status status-active">
      <div class="status-icon"></div>
      <span id="status-text">Active on Feedbin</span>
    </div>
    <div class="info-card">
      Detects <strong>Value 4 Value</strong> in RSS feeds and adds a Lightning button to Feedbin.
    </div>
  </div>
  <div class="footer">
    <span>v1.0.0</span>
    <a href="https://github.com/feedbin/feedbin" target="_blank">OSS</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
